# Model Registry — Card Type Support
#
# Card names follow the official product matrix:
#   https://docs.rbln.ai/latest/supports/version_matrix.html
#
# Each card may declare `aliases:` — alternative names accepted by the
# CLI's `--card` filter. Matching is case-insensitive, so for example
#   rbln-zoo list --card rbln-ca25
# resolves to RBLN-CA25.
#
# Models default to the cards of their product tree — the top-level
# directory (ATOM/, Rebel100/) keyed in `default_cards`. Add per-model
# overrides below when support differs from the product default.

cards:
  RBLN-CA22:
    description: "ATOM™+"
  RBLN-CA25:
    description: "ATOM™-Max"
  RBLN-CR13:
    description: "Rebel100™"

default_cards:
  ATOM: [RBLN-CA22, RBLN-CA25]
  Rebel100: [RBLN-CR13]

# Per-model overrides (only needed when supported cards differ from
# the product default above).
#
# Example:
#
# overrides:
#   ATOM/huggingface/transformers/.../model-a:
#     cards: [RBLN-CA25]                  # CA25 only
#   ATOM/huggingface/transformers/.../model-b:
#     cards: [RBLN-CA22]
overrides: {}
