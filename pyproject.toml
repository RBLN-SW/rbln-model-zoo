[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "consolidated-reqs"
version = "0.0.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "PyYAML>=6.0.3",
  "pyyaml>=6.0.1",
  "rich>=13.0.0",
  "tomli>=2.0; python_version < \"3.11\"",
  "typer>=0.9.0",
]

[project.optional-dependencies]
models = [
  "addict==2.4.0",
  "attr==0.3.2",
  "attrs==25.3.0",
  "better_profanity==0.7.0",
  "cmake>=3.22",
  "controlnet-aux>=0.0.10",
  "cosmos-guardrail==0.3.1",
  "datasets>=2.19.1",
  "decord>=0.6.0 ; platform_machine == 'x86_64'",
  "easydict==1.13",
  "einops==0.8.1",
  "evo>=1.34.3",
  "fire==0.7.1",
  "gdown>=6.0.0",
  "gevent==25.9.1",
  "geventhttpclient==2.3.5",
  "huggingface-hub>=0.23.0",
  "hydra-core==1.3.2",
  "imageio[ffmpeg,pyav]==2.37.0",
  "imageio_ffmpeg==0.6.0",
  "iopath>=0.1.10",
  "ipdb==0.13.13",
  "librosa>=0.11.0",
  "loguru>=0.7.3",
  "matplotlib>=3.8.0",
  "mir-eval==0.7",
  "mistral_common>=1.8.5",
  "moviepy==1.0.3",
  "natsort==8.4.0",
  "nltk==3.9.1",
  "numpy>=2.0.2",
  "omegaconf>=2.3.0",
  "onnxruntime==1.22.1",
  "opencv-python>=4.9.0.80",
  "opencv-python-headless>=4.11.0",
  "optimum-rbln==0.11.0a14",
  "pandas>=2.2.2",
  "peft>=0.15.0",
  "pillow>=10.2.0",
  "plyfile>=1.1.3",
  "protobuf>=4.25.5",
  "pycocotools>=2.0.7",
  "pycolmap>=3.13.0 ; platform_machine == 'x86_64'",
  "pynvml==12.0.0",
  "python-magic==0.4.27",
  "qwen-vl-utils[decord]==0.0.11 ; platform_machine == 'x86_64'",
  "ray[serve]==2.51.1",
  "requests>=2.32.3",
  "retinaface_py==0.0.2",
  "rtmlib==0.0.13",
  "sam2==1.1.0",
  "scipy>=1.11.4",
  "seaborn>=0.13.2",
  "sentence-transformers>=5.0.0",
  "sentencepiece>=0.2.0",
  "setuptools<81",
  "smplx==0.1.28",
  "soundfile>=0.13.1",
  "tabulate==0.9.0",
  "tensorflow==2.18.0",
  "termcolor==2.5.0",
  "tf_keras==2.18.0",
  "thop>=0.1.1",
  "timm>=0.9.16",
  "torch==2.11.0+cpu",
  "torch-model-archiver>=0.12.0",
  "torch-workflow-archiver==0.2.15",
  "torchaudio==2.11.0+cpu ; platform_machine == 'x86_64'",
  "torchcodec==0.11.0+cpu ; platform_machine == 'x86_64'",
  "torchserve>=0.12.0",
  "torchvision==0.26.0+cpu ; platform_machine == 'x86_64'",
  "transformers==5.8.1",
  "trimesh>=4.11.2",
  "tritonclient==2.62.0",
  "ultralytics==8.3.33",
  "vllm-rbln==0.11.0a9",
]

[project.scripts]
rbln-zoo = "rbln_zoo.cli:app"

[tool.setuptools]
packages = ["rbln_zoo"]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
  "huggingface", "pytorch", "pytorch_dynamo",
  "tensorflow", "cpp", "serving",
  "rbln_zoo", "utils", "scripts",
]

[tool.uv]
environments = [
  "platform_machine == 'x86_64' and platform_system == 'Linux' and sys_platform == 'linux'",
  "platform_machine == 'aarch64' and platform_system == 'Linux' and sys_platform == 'linux'",
]
build-constraint-dependencies = ["torch>=0"]
config-settings-package = { "vllm-rbln" = { "--build-option" = "--torch-backend=cpu" } }

[tool.uv.extra-build-dependencies]
torchmcubes = ["torch"]
uv-unwrapper = ["torch"]
texture-baker = ["torch"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchcodec = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "vllm-cpu"
url = "https://wheels.vllm.ai/0.22.0/cpu"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
